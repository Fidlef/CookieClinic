<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CookieClinic</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head>
<body><main><header><p>SESSION CONFIGURATION LAB</p><h1>Cookie<span>Clinic</span></h1><p>Paste a synthetic <code>Set-Cookie</code> header and get rule-based, context-aware feedback without sending it anywhere.</p></header>
<section class="lab"><div class="input-card"><label for="cookie">Set-Cookie header</label><textarea id="cookie" spellcheck="false">session=synthetic-demo; Path=/; SameSite=Lax</textarea><fieldset><legend>Deployment context</legend><label><input type="radio" name="context" value="https" checked> Production HTTPS</label><label><input type="radio" name="context" value="local"> Local development</label></fieldset><button id="analyze">Run examination</button><button id="demo" class="secondary">Load prefix-rule demo</button><small>Use fake values only. Analysis stays in this tab.</small></div>
<div class="report" aria-live="polite"><div class="grade"><span id="grade">—</span><div><small>CONFIGURATION</small><strong id="label">Waiting</strong></div></div><div id="parsed" class="parsed"></div><h2>Clinical notes</h2><div id="findings"></div></div></section></main></body></html>
